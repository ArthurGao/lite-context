name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]   # a release: the package job's wheel and sdist go to the GitHub Release
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit (the same pins as lite-agent); the comment names the version.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (design §0): the first hosts include one on 3.11.
        python: ["3.11", "3.12"]
    services:
      postgres:
        # The image lite-agent and lite-cache pin (pgvector is not needed: one pin, not two).
        image: pgvector/pgvector:0.8.6-pg18
        env:
          # No password: the container lives only for this job and listens only on the runner.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: lite_context
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 1s --health-timeout 5s --health-retries 30
    env:
      LITECONTEXT_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/lite_context
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          version: "0.10.8"
      - run: uv sync --locked --all-extras --python ${{ matrix.python }}
      - run: uv run ruff check && uv run ruff format --check
      - run: uv run mypy --python-version ${{ matrix.python }}
      - run: uv run pytest

  # Hosts install the release wheel by URL (design §12, §14 C3): build it, install it alone in a
  # clean environment on the 3.11 floor and run the README's example there. On a v* tag the
  # release job publishes exactly what this job built.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          version: "0.10.8"
      - run: uv build --out-dir dist
      - name: the tag names the version being released
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -f "dist/lite_context-${GITHUB_REF_NAME#v}-py3-none-any.whl"
      - name: the wheel says it is typed (PEP 561), or hosts' type checkers treat it as untyped
        run: python3 -c "import glob, zipfile; assert 'lite_context/py.typed' in zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist()"
      - name: the wheel works from a clean venv
        run: |
          uv venv --python 3.11 /tmp/clean
          uv pip install --python /tmp/clean "$(ls dist/*.whl)"
          cd /tmp && /tmp/clean/bin/python -I "$GITHUB_WORKSPACE/scripts/smoke.py"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: dist
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # this job only: create the release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333   # v8.0.2
        with:
          name: dist
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
