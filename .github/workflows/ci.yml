name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit (the same pins as lite-agent); the comment names the version.

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (design §0): the first hosts include one on 3.11.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2   # v10.3.3
        with:
          version: "0.10.8"
      - run: uv sync --locked --python ${{ matrix.python }}
      - run: uv run ruff check && uv run ruff format --check
      - run: uv run mypy --python-version ${{ matrix.python }}
      - run: uv run pytest
