[project]
name = "lite-context"
version = "0.3.2"
description = "Context management for LLM calls: what each call should see"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
# The core has no run-time dependencies (AGENTS.md rule 6). Extras arrive with their stages
# (design §14): lite-model (adapter), pg (C5), server (C6).
dependencies = []

[project.scripts]
litecontext = "lite_context.cli:main"

[project.optional-dependencies]
pg = [
    "psycopg[binary,pool]==3.3.8",
]
server = [
    "fastapi==0.162.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "hypothesis==6.151.9",
    "ruff==0.15.12",
    "mypy==1.20.2",
    "httpx==0.28.1",
]

[build-system]
requires = ["uv_build>=0.10,<0.11"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
# Python 3.11 is the floor (design §0): ruff then rejects 3.12-only syntax.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "scripts"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
